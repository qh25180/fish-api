<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#007acc">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<title>导航</title>
<link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
<div class="topbar">
  <span class="topbar-title">📑 导航</span>
  <a href="/logout" class="topbar-logout" title="退出登录" aria-label="退出登录">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
  </a>
</div>
{% for title, desc, href in pages %}
<a class="card" href="{{ href }}">
<div class="card-title">{{ title }}</div>
<div class="card-desc">{{ desc }}</div>
</a>
{% endfor %}
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/js/sw.js', { scope: '/' }).catch(() => {});
  });
}
</script>
</body>
</html>
