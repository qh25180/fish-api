<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#007acc">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<title>文件管理</title>
<link rel="stylesheet" href="{{ asset('css/pages.css') }}">
</head>
<body>
<div class="toolbar">
<a href="/api/v1/novels/pages" class="toolbar-back">← 返回索引</a>
<form method="post" action="/api/v1/novels/batch-rename" class="toolbar-form" onsubmit="return confirm('按当前配置（FILE_RENAME_MODE）一键重命名所有未隐藏小说？');">
<button type="submit" class="toolbar-btn">🔄 一键重命名</button>
</form>
</div>
<h2>[文件管理]</h2>
{% if msg_html %}{{ msg_html|safe }}{% endif %}
<div class="table-wrap">
<table>
<thead>
<tr><th>文件名</th><th>大小</th><th>作者</th><th>修改时间</th><th>操作</th></tr>
</thead>
<tbody>
{% if not files %}
<tr><td colspan="5" style="text-align:center;padding:24px;color:#666;">暂无文件</td></tr>
{% else %}
{% for f in files %}
<tr{% if f.is_hidden %} class="hidden-row"{% endif %}>
<td>{{ f.safe_fn }}</td>
<td>{{ f.size_hint }}</td>
<td>{{ f.author }}<br><a href="#" onclick="event.preventDefault();var a=document.getElementById('author-{{ f.encoded_fn }}');a.style.display=a.style.display==='none'?'block':'none';return false;" style="font-size:12px;color:#007acc;">修改</a></td>
<td>{{ f.mod_time }}</td>
<td class="actions">
<a href="{{ f.dl_url }}" class="btn-download" download>下载</a>
<form method="post" action="/api/v1/novels/{{ f.encoded_fn }}/delete" class="delete-form" onsubmit="return confirm('确定删除 {{ f.safe_fn_js }}？');">
<button type="submit" class="btn-delete">删除</button>
</form>
<form method="post" action="/api/v1/novels/{{ f.encoded_fn }}/hide" class="delete-form">
<button type="submit" class="{{ f.hide_btn_class }}">{{ f.hide_btn_text }}</button>
</form>
<button type="button" class="btn-rename" onclick="var f=document.getElementById('rename-{{ f.encoded_fn }}');f.style.display=f.style.display==='block'?'none':'block'">重命名</button>
<form method="post" action="/api/v1/novels/{{ f.encoded_fn }}/rename" class="rename-form" id="rename-{{ f.encoded_fn }}">
<input type="text" name="new_name" value="{{ f.safe_fn }}" required>
<button type="submit" style="background:#007acc;color:#fff;border:none;border-radius:4px;">确认</button>
</form>
<form method="post" action="/api/v1/novels/{{ f.encoded_fn }}/author" class="rename-form" id="author-{{ f.encoded_fn }}" style="display:none;">
<input type="text" name="new_author" value="{{ f.author }}" required style="width:120px;">
<button type="submit" style="background:#007acc;color:#fff;border:none;border-radius:4px;">确认</button>
</form>
</td>
</tr>
{% endfor %}
{% endif %}
</tbody>
</table>
</div>
{% if pagination_html %}{{ pagination_html|safe }}{% endif %}
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/js/sw.js', { scope: '/' }).catch(() => {});
  });
}
</script>
</body>
</html>
