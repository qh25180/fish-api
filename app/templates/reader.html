<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#007acc">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<title>文本阅读</title>
<link rel="stylesheet" href="/static/css/reader.css">
</head>
<body>
<div class="container">
  <!-- 顶部栏 -->
  <div class="header">
    <span class="book-name" id="headerTitle">[文本阅读]</span>
    <span class="page-stat" id="pageInfo"></span>
    <button class="icon-btn" id="btnTts" onclick="toggleTts()" title="朗读" style="display:none">🔊</button>
    <button class="icon-btn" id="btnSettings" onclick="showSettings()" title="阅读设置">⚙️</button>
    <button class="icon-btn" id="btnChapters" onclick="toggleChapterList()" title="章节目录" style="display:none">📑</button>
    <button class="icon-btn" id="btnBack" onclick="backToBooks()" title="返回书架">✕</button>
  </div>

  <!-- 选书 -->
  <div id="bookView" style="flex:1;overflow-y:auto;">
    <div class="loading" id="bookLoading">加载书架...</div>
    <ul class="book-list" id="bookList" style="display:none"></ul>
  </div>

  <!-- 阅读区 -->
  <div id="readerView" style="display:none;flex:1;flex-direction:column;min-height:0;">
    <div class="reader-wrap" style="flex:1;position:relative;">
      <div class="nav-left">
        <button class="nav-btn" id="btnPrevPage" onclick="prevPage()" disabled><span class="nav-icon">◀</span><span class="nav-txt">上一页</span></button>
      </div>
      <!-- 点击热区：上方整行+左侧整列=上一页；下方整行+右侧整列=下一页 -->
      <div class="tap-zone tap-zone-prev-top" onclick="prevPage()" title="上一页"></div>
      <div class="tap-zone tap-zone-prev-left" onclick="prevPage()" title="上一页"></div>
      <div class="tap-zone tap-zone-next-bottom" onclick="nextPage()" title="下一页"></div>
      <div class="tap-zone tap-zone-next-right" onclick="nextPage()" title="下一页"></div>
      <div class="reader">
        <div class="reader-title" id="readerTitle"></div>
        <div class="reader-text" id="readerText"></div>
        <!-- 章节加载中提示 -->
        <div class="reader-loading" id="readerLoading" style="display:none">
          <div class="spinner"></div>
          <span>章节加载中...</span>
        </div>
      </div>
      <div class="nav-right">
        <button class="nav-btn" id="btnNextPage" onclick="nextPage()" disabled><span class="nav-txt">下一页</span><span class="nav-icon">▶</span></button>
      </div>
    </div>
  </div>
  <div class="footer-spacer"></div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>阅读设置</h3>
    <label for="fontSizeSlider">字号</label>
    <input type="range" id="fontSizeSlider" min="12" max="32" value="17">
    <div class="range-val" id="fontSizeVal">17px</div>
    <label>背景</label>
    <div class="color-presets" id="colorPresets"></div>

    <hr class="settings-sep">
    <label>朗读引擎</label>
    <select class="tts-engine-sel" id="ttsEngineSel"></select>
    <label>语速 <span class="range-val-inline" id="ttsRateVal">1.0x</span></label>
    <input type="range" id="ttsRateSlider" min="5" max="20" value="10">

    <button class="btn-confirm" onclick="applySettings()">确定</button>
  </div>
</div>

  <!-- 章节列表弹窗 -->
  <div class="modal-overlay" id="chaptersModal">
    <div class="modal chapters-modal">
      <h3>章节目录</h3>
      <div class="chapters-jump">
        <input type="number" id="chapterJumpInput" min="1" placeholder="输入章节号跳转" onkeydown="if(event.key==='Enter') jumpToChapter()">
        <button class="jump-btn" onclick="jumpToChapter()">跳转</button>
      </div>
      <div class="chapters-list" id="chapterList"></div>
      <button class="btn-confirm" onclick="hideChapters()">关闭</button>
    </div>
  </div>

<script>
window.QHAPI_CONFIG = { token: '{{ token }}' };
</script>
{% raw %}
<script>
(function() {
  const BASE = '/api/v1/novels';
  const TOKEN = window.QHAPI_CONFIG.token || '';

  // ─── 设置 ──────────────────────────
  const THEMES = [
    { name: '护眼黄', bg: '#f5f1eb', card: '#fff', text: '#333' },
    { name: '纯白',   bg: '#ffffff', card: '#fff', text: '#333' },
    { name: '暗黑',   bg: '#1a1a2e', card: '#16213e', text: '#e0e0e0' },
    { name: '羊皮纸', bg: '#f4ecd8', card: '#faf3e6', text: '#4a3b32' },
    { name: '墨绿',   bg: '#d4e6d8', card: '#e8f0e8', text: '#2d3a3a' },
  ];
  let settings = JSON.parse(localStorage.getItem('qhapi_reader_settings') || '{}');
  if (!settings.fontSize) settings = { fontSize: 17, themeIndex: 0 };
  if (!settings.ttsEngine) settings.ttsEngine = 'edge';
  if (!settings.ttsRate) settings.ttsRate = 1.0;
  let savedSettings = null;
  let sliderTimer = null;
  applyTheme(settings);

  function applyTheme(s, save = true) {
    const t = THEMES[s.themeIndex] || THEMES[0];
    document.documentElement.style.setProperty('--font-size', s.fontSize + 'px');
    document.documentElement.style.setProperty('--line-height', (s.fontSize > 22 ? 1.7 : 1.9));
    document.documentElement.style.setProperty('--bg-color', t.bg);
    document.documentElement.style.setProperty('--card-bg', t.card);
    document.documentElement.style.setProperty('--text-color', t.text);
    if (save) localStorage.setItem('qhapi_reader_settings', JSON.stringify(s));
  }

  // 等浏览器应用新样式后再重新分页
  function reflowAfterTheme() {
    if (!chapterText) return;
    requestAnimationFrame(() => reflowPage());
  }

  window.showSettings = function() {
    savedSettings = JSON.parse(JSON.stringify(settings));
    const modal = document.getElementById('settingsModal');
    modal.classList.add('show');
    const slider = document.getElementById('fontSizeSlider');
    slider.value = settings.fontSize;
    document.getElementById('fontSizeVal').textContent = settings.fontSize + 'px';
    // 朗读引擎 + 语速
    renderTtsEngines();
    const rate = document.getElementById('ttsRateSlider');
    rate.value = Math.round((settings.ttsRate || 1.0) * 10);
    document.getElementById('ttsRateVal').textContent = settings.ttsRate + 'x';
    rate.oninput = function() {
      document.getElementById('ttsRateVal').textContent = (this.value / 10) + 'x';
      settings.ttsRate = this.value / 10;
    };
    const presets = document.getElementById('colorPresets');
    presets.innerHTML = '';
    THEMES.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.style.background = t.bg;
      btn.style.borderColor = t.bg;
      if (i === settings.themeIndex) btn.classList.add('active');
      btn.title = t.name;
      btn.onclick = () => {
        presets.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        settings.themeIndex = i;
        applyTheme(settings, false); // 实时预览背景色
      };
      presets.appendChild(btn);
    });
    slider.oninput = function() {
      document.getElementById('fontSizeVal').textContent = this.value + 'px';
      settings.fontSize = parseInt(this.value);
      applyTheme(settings, false); // 实时预览字号
      // 防抖：停止拖动后自动重新分页
      clearTimeout(sliderTimer);
      sliderTimer = setTimeout(reflowAfterTheme, 120);
    };
  };

  window.applySettings = function() {
    document.getElementById('settingsModal').classList.remove('show');
    applyTheme(settings); // 保存设置
    localStorage.setItem('qhapi_reader_settings', JSON.stringify(settings));
    reflowAfterTheme();
  };

  // 渲染朗读引擎下拉列表
  function renderTtsEngines() {
    const sel = document.getElementById('ttsEngineSel');
    if (!sel) return;
    const engines = [
      { id: 'native', name: '浏览器原生语音' },
      { id: 'edge', name: 'Edge 云语音（微软）' },
      { id: 'local', name: '局域网 Piper（自建）' },
    ];
    sel.innerHTML = '';
    engines.forEach(function(e) {
      const opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = e.name;
      if (e.id === 'native' && !ttsSupported()) {
        opt.disabled = true;
        opt.textContent += '（当前浏览器不支持）';
      }
      sel.appendChild(opt);
    });
    sel.value = settings.ttsEngine || 'edge';
    sel.onchange = function() { settings.ttsEngine = sel.value; };
  }

  // 浏览器原生 TTS 支持检测（speechSynthesis 存在 + 有可用 voices 才认为支持）
  function ttsSupported() {
    if (typeof speechSynthesis === 'undefined' || typeof SpeechSynthesisUtterance === 'undefined') return false;
    try { return window.speechSynthesis.getVoices().length > 0; } catch (e) { return false; }
  }

  // 点击遮罩 = 取消，恢复原设置
  document.getElementById('settingsModal').onclick = function(e) {
    if (e.target === this) {
      settings = savedSettings || settings;
      applyTheme(settings);
      this.classList.remove('show');
      reflowAfterTheme();
    }
  };

  // ─── 触摸点击反馈（移动端） ─────────
  // :active 在移动浏览器上不可靠，且会被系统 tap 高亮覆盖，
  // 这里用 touch 事件手动加 .tapping 类控制反馈色
  document.querySelectorAll('.tap-zone').forEach(z => {
    z.addEventListener('touchstart', () => z.classList.add('tapping'), { passive: true });
    z.addEventListener('touchend', () => z.classList.remove('tapping'));
    z.addEventListener('touchcancel', () => z.classList.remove('tapping'));
    // 鼠标端也统一（保留 :active 同时加类，更可靠）
    z.addEventListener('mousedown', () => z.classList.add('tapping'));
    z.addEventListener('mouseup', () => z.classList.remove('tapping'));
    z.addEventListener('mouseleave', () => z.classList.remove('tapping'));
  });

  // ─── 分页计算（实测，保证不溢出） ──────
  function findMaxFit(text, el) {
    // 二分查找：在当前视口内能完整显示的最长前缀
    let lo = 1, hi = text.length, best = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      el.textContent = text.substring(0, mid);
      if (el.scrollHeight <= el.clientHeight + 1) {
        best = mid; lo = mid + 1;
      } else {
        hi = mid - 1;
      }
    }
    return Math.max(1, best);
  }

  // 构建页面历史：从章节开头逐页测量，直到覆盖恢复位置
  function buildPageHistory() {
    const el = document.getElementById('readerText');
    if (!el || !el.clientHeight) { pageHistory = [pageOffset]; return; }
    const target = Math.min(pageOffset, Math.max(0, chapterText.length - 1));
    const hist = [0];
    if (target > 0) {
      let pos = 0;
      while (pos < target) {
        const n = findMaxFit(chapterText.substring(pos), el);
        if (n <= 0) break;
        pos += n;
        if (pos >= target) break; // 恢复位置落在本页内，不再记录下一页起点
        hist.push(pos);
      }
    }
    pageHistory = hist;
    // 恢复位置所在页的起点（该页完整包含上次读到的地方）
    pageOffset = hist[hist.length - 1];
  }

  // ─── 数据 ──────────────────────────
  let books = [];
  let chapters = [];
  let book = null;
  let chapterIndex = 0;
  let chapterText = '';
  let pageOffset = 0;
  let snippetLen = 500;
  let pageHistory = []; // 已访问页面的起始位置栈（栈顶 = 当前页起点）
  let jumpToEnd = false; // 切上一章后定位到章节末尾

  async function api(path, params) {
    const url = new URL(path, location.origin);
    if (params) Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    const headers = TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {};
    const resp = await fetch(url, { headers });
    const raw = await resp.json();
    const data = raw.detail || raw;
    if (data.isSuccess === false) throw new Error(data.errorMsg || '请求失败');
    return data.data !== undefined ? data.data : data;
  }

  // ─── 选书 ──────────────────────────
  async function loadBooks() {
    try {
      books = await api('/getBookshelf');
      books.sort((a, b) => (b.durChapterTime || 0) - (a.durChapterTime || 0));
      const list = document.getElementById('bookList');
      list.innerHTML = '';
      books.forEach((b, i) => {
        const li = document.createElement('li');
        li.className = 'book-item';
        const progress = b.durChapterTitle ? '上次阅读: ' + b.durChapterTitle : '未阅读';
        const author = b.author && b.author !== '未知作者' ? ' · ' + b.author : '';
        li.innerHTML = '<div class="book-name-lg">' + escHtml(b.name) + '</div>'
          + '<div class="book-info">' + escHtml(progress) + author + ' · ' + b.totalChapterNum + ' 章</div>';
        li.onclick = () => selectBook(i);
        list.appendChild(li);
      });
      document.getElementById('bookLoading').style.display = 'none';
      list.style.display = 'block';
    } catch (e) {
      document.getElementById('bookLoading').textContent = '加载失败: ' + e.message;
    }
  }

  async function selectBook(index) {
    book = books[index];
    document.getElementById('headerTitle').textContent = book.name;
    document.getElementById('bookView').style.display = 'none';
    const rv = document.getElementById('readerView');
    rv.style.display = 'flex';
    document.getElementById('btnChapters').style.display = 'inline-flex';
    document.getElementById('btnTts').style.display = 'inline-flex';

    try {
      chapters = await api('/getChapterList', { url: book.bookUrl });
      renderChapterList();
      chapterIndex = book.durChapterIndex || 0;
      pageOffset = book.durChapterPos || 0;
      await loadChapter();
    } catch (e) {
      document.getElementById('readerText').textContent = '加载章节失败: ' + e.message;
    }
  }

  // 返回书架列表（在阅读视图）；在书架页则返回索引页
  window.backToBooks = function() {
    const rv = document.getElementById('readerView');
    // 已在书架列表页 → 跳转索引页
    if (rv.style.display === 'none') {
      window.location.href = '/api/v1/novels/pages';
      return;
    }
    rv.style.display = 'none';
    document.getElementById('bookView').style.display = 'block';
    document.getElementById('headerTitle').textContent = '[文本阅读]';
    document.getElementById('pageInfo').textContent = '';
    document.getElementById('btnChapters').style.display = 'none';
    document.getElementById('btnTts').style.display = 'none';
    ttsStop();
    hideChapters();
    loadBooks(); // 刷新列表（保持最近阅读排序）
  };

  // ─── 章节列表弹窗（虚拟滚动） ─────
  const CH_ITEM_H = 38; // 每章固定行高（与 CSS 一致）
  const CH_BUFFER = 8;  // 上下缓冲行数
  let chScrollTop = 0;

  window.toggleChapterList = function() {
    const modal = document.getElementById('chaptersModal');
    modal.classList.toggle('show');
    // 打开时滚动到当前章节
    if (modal.classList.contains('show')) {
      scrollChaptersToCurrent();
    }
  };

  window.hideChapters = function() {
    document.getElementById('chaptersModal').classList.remove('show');
  };

  // 点击遮罩关闭章节弹窗
  document.getElementById('chaptersModal').onclick = function(e) {
    if (e.target === this) hideChapters();
  };

  // 滚动到当前章节
  function scrollChaptersToCurrent() {
    const list = document.getElementById('chapterList');
    list.scrollTop = chapterIndex * CH_ITEM_H;
  }

  // 虚拟滚动渲染：只渲染可视区 ± 缓冲
  function renderChapterList() {
    const list = document.getElementById('chapterList');
    if (!chapters.length) {
      list.innerHTML = '<div class="chapter-item" style="position:static">暂无章节</div>';
      return;
    }
    // 容器总高度（占位撑出滚动条）
    const totalH = chapters.length * CH_ITEM_H;
    // 重建：外层占位 + 内部可见区
    list.innerHTML = '';
    const spacer = document.createElement('div');
    spacer.style.height = totalH + 'px';
    spacer.style.position = 'relative';
    list.appendChild(spacer);

    const render = () => {
      const scrollTop = list.scrollTop;
      const vh = list.clientHeight;
      const startIdx = Math.max(0, Math.floor(scrollTop / CH_ITEM_H) - CH_BUFFER);
      const endIdx = Math.min(chapters.length, Math.ceil((scrollTop + vh) / CH_ITEM_H) + CH_BUFFER);
      // 清理旧节点（保留 spacer）
      spacer.querySelectorAll('.chapter-item').forEach(n => n.remove());
      for (let i = startIdx; i < endIdx; i++) {
        const ch = chapters[i];
        const div = document.createElement('div');
        div.className = 'chapter-item' + (i === chapterIndex ? ' active' : '');
        div.style.top = (i * CH_ITEM_H) + 'px';
        div.innerHTML = '<span class="ch-num">' + (i + 1) + '</span><span class="ch-title">' + escHtml(ch.title) + '</span>';
        div.onclick = () => {
          chapterIndex = i; pageOffset = 0; hideChapters(); loadChapter();
        };
        spacer.appendChild(div);
      }
    };

    list.onscroll = render; // 滚动时增量渲染
    render();
  }

  // 按章节号跳转
  window.jumpToChapter = function() {
    const input = document.getElementById('chapterJumpInput');
    const n = parseInt(input.value, 10);
    if (!n || n < 1 || n > chapters.length) {
      input.value = '';
      input.placeholder = '请输入 1-' + chapters.length + ' 的章节号';
      return;
    }
    chapterIndex = n - 1; pageOffset = 0; hideChapters(); loadChapter();
  };

  async function loadChapter() {
    if (chapterIndex < 0 || chapterIndex >= chapters.length) return;
    if (!ttsAuto && ttsState !== 'idle') ttsStop(); // 切换章节时停止朗读（朗读循环内除外）
    document.getElementById('readerTitle').textContent = chapters[chapterIndex].title;
    document.getElementById('readerLoading').style.display = 'flex';
    document.getElementById('readerText').style.display = 'none';

    try {
      chapterText = await api('/getBookContent', { url: book.bookUrl, index: chapterIndex });
      chapterText = htmlToText(chapterText);
      // 上一章切换：定位到本章最后一页
      if (jumpToEnd) {
        jumpToEnd = false;
        pageOffset = Math.max(0, chapterText.length - 1);
      }
      // 等待 DOM 布局完成后再分页
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.getElementById('readerLoading').style.display = 'none';
          document.getElementById('readerText').style.display = 'block';
          buildPageHistory(); // 恢复进度：构建从章节开头到当前位置的完整页面历史
          reflowPage(); renderChapterList(); saveProgress();
        });
      });
    } catch (e) {
      document.getElementById('readerLoading').style.display = 'none';
      document.getElementById('readerText').style.display = 'block';
      document.getElementById('readerText').textContent = '加载失败: ' + e.message;
    }
  }

  function reflowPage() {
    if (pageOffset >= chapterText.length) pageOffset = Math.max(0, chapterText.length - 1);
    const el = document.getElementById('readerText');
    if (!el || !el.clientHeight) { snippetLen = 500; return; }
    const remaining = chapterText.substring(pageOffset);
    // 修复：剩余内容全为空白（章节尾部空行/空白）时，显示"本章完"，避免空白页
    if (!remaining.trim()) {
      el.textContent = '—— 本章完 ——';
      document.getElementById('pageInfo').textContent = chapterText.length + ' / ' + chapterText.length + '字';
      document.getElementById('btnPrevPage').disabled = (pageOffset <= 0 && chapterIndex <= 0);
      document.getElementById('btnNextPage').disabled = (chapterIndex >= chapters.length - 1);
      return;
    }
    snippetLen = findMaxFit(remaining, el);
    const end = Math.min(pageOffset + snippetLen, chapterText.length);
    el.textContent = remaining.substring(0, snippetLen) || '（本章暂无内容）';
    document.getElementById('pageInfo').textContent = (pageOffset + 1) + '-' + end + ' / ' + chapterText.length + '字';
    document.getElementById('btnPrevPage').disabled = (pageOffset <= 0 && chapterIndex <= 0);
    document.getElementById('btnNextPage').disabled = (end >= chapterText.length && chapterIndex >= chapters.length - 1);
  }

  window.prevPage = function() {
    if (!ttsAuto && ttsState !== 'idle') ttsStop(); // 手动翻页停止朗读
    // 章首继续点 → 切上一章（翻到上一章末尾）
    if (pageOffset <= 0 && pageHistory.length <= 1) {
      prevChapter(); return;
    }
    // 弹出当前页起点，回到上一页起点（栈顶）
    if (pageHistory.length > 1) pageHistory.pop();
    pageOffset = pageHistory[pageHistory.length - 1];
    reflowPage();
    saveProgress();
  };

  window.nextPage = function() {
    if (!ttsAuto && ttsState !== 'idle') ttsStop(); // 手动翻页停止朗读
    // 剩余内容为空（本章完状态）或已到章末 → 切下一章
    const rest = chapterText.substring(pageOffset + snippetLen);
    if (pageOffset + snippetLen >= chapterText.length || !rest.trim()) { nextChapter(); return; }
    pageOffset += snippetLen;
    pageHistory.push(pageOffset); // 记录新页起点
    reflowPage();
    saveProgress();
  };

  window.prevChapter = function() {
    if (!ttsAuto && ttsState !== 'idle') ttsStop(); // 手动切章停止朗读
    if (chapterIndex <= 0) return;
    jumpToEnd = true; // 切到上一章最后一页
    chapterIndex--; pageOffset = 0; loadChapter();
  };

  window.nextChapter = function() {
    if (!ttsAuto && ttsState !== 'idle') ttsStop(); // 手动切章停止朗读
    if (chapterIndex >= chapters.length - 1) return;
    chapterIndex++; pageOffset = 0; loadChapter();
  };

  async function saveProgress() {
    if (!book) return;
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
      await fetch('/saveBookProgress', {
        method: 'POST', headers: headers,
        body: JSON.stringify({
          name: book.name, author: book.author,
          durChapterIndex: chapterIndex, durChapterPos: pageOffset,
          durChapterTime: Date.now(),
          durChapterTitle: (chapters[chapterIndex] || {}).title || ''
        })
      });
    } catch (e) {}
  }

  // ─── TTS 朗读（三引擎 + 一句一读高亮） ─────
  // 状态：idle | loading | playing
  let ttsState = 'idle';
  let ttsAudio = null;      // edge/local 的 Audio 实例
  let ttsUtterance = null;  // 浏览器原生语音实例
  let ttsAuto = false;      // 朗读循环内自动翻页标志（避免循环翻页被手动停止逻辑打断）
  let ttsGen = 0;           // 朗读代次：开始/停止递增，旧代次异步回调据此失效（解决取消后仍播放）
  let ttsAborts = [];       // 在途合成 AbortController 列表（取消时全部中止）
  let pageSentences = [];   // 当前页句子列表（一句一读）

  // 切分句子（按中文标点；超长句按 100 字切分兜底；保留换行标记用于渲染 <br>）
  function splitSentences(text) {
    const raw = text.match(/[^。！？；…\n]+[。！？；…]?|\n+/g) || [];
    const out = [];
    for (let i = 0; i < raw.length; i++) {
      const t = raw[i];
      if (/^\n+$/.test(t)) { out.push('\n'); continue; } // 换行标记（渲染为 <br>，不朗读）
      const s = t.trim();
      if (!s) continue;
      if (s.length > 200) {
        for (let j = 0; j < s.length; j += 100) out.push(s.substring(j, j + 100));
      } else {
        out.push(s);
      }
    }
    return out;
  }

  // 高亮渲染：把当前页句子渲染为 span（换行渲染为 <br>），当前朗读句 active
  function renderHighlight(index) {
    const el = document.getElementById('readerText');
    if (!el || !pageSentences.length) return;
    let html = '';
    let speakIndex = -1;
    for (let i = 0; i < pageSentences.length; i++) {
      const s = pageSentences[i];
      if (s === '\n') { html += '<br>'; continue; }
      speakIndex++;
      html += '<span class="tts-sentence' + (speakIndex === index ? ' active' : '') + '">'
        + escHtml(s) + '</span>';
    }
    el.innerHTML = html;
  }

  // 清除高亮，恢复纯文本分页显示
  function clearTtsHighlight() {
    const el = document.getElementById('readerText');
    if (!el) return;
    if (chapterText !== undefined && chapterText !== '') { reflowPage(); }
    else { el.textContent = ''; }
  }

  // 当前页朗读文本（与分页一致）
  function currentPageText() {
    const remaining = chapterText.substring(pageOffset);
    const len = Math.min(snippetLen || 500, remaining.length);
    return remaining.substring(0, len);
  }

  function updateTtsButton() {
    const btn = document.getElementById('btnTts');
    if (!btn) return;
    if (ttsState === 'idle') { btn.textContent = '🔊'; btn.title = '朗读'; }
    else if (ttsState === 'loading') { btn.textContent = '⏳'; btn.title = '合成中，点击取消'; }
    else { btn.textContent = '⏹'; btn.title = '停止朗读'; }
  }

  // 合成文本（edge/local），返回 objectURL；取消/失败返回 null（由调用方处理报错）
  async function synthesizeText(text, engine, gen) {
    const controller = new AbortController();
    ttsAborts.push(controller);
    try {
      const resp = await fetch('/api/v1/tts', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {})
        },
        body: JSON.stringify({ engine: engine, text: text }),
        signal: controller.signal
      });
      if (gen !== ttsGen) return null; // 已取消
      if (!resp.ok) {
        const err = await resp.json().catch(function() { return {}; });
        throw new Error(err.detail || ('TTS 失败 HTTP ' + resp.status));
      }
      const blob = await resp.blob();
      if (gen !== ttsGen) return null; // 已取消
      return URL.createObjectURL(blob);
    } catch (e) {
      if (gen !== ttsGen) return null; // 取消静默
      throw e;
    } finally {
      ttsAborts = ttsAborts.filter(function(a) { return a !== controller; });
    }
  }

  // 播放已合成的音频 URL（edge/local），播放结束后 resolve
  function playAudio(url, gen) {
    return new Promise(function(resolve, reject) {
      const audio = new Audio(url);
      audio.playbackRate = settings.ttsRate || 1.0;
      let done = false;
      const finish = function(err) {
        if (done) return;
        done = true;
        try { audio.pause(); } catch (e) {}
        try { URL.revokeObjectURL(url); } catch (e) {}
        err ? reject(err) : resolve();
      };
      audio.onended = function() { finish(); };
      audio.onerror = function() { finish(new Error('音频播放失败')); };
      audio.play().catch(function(e) { finish(new Error('播放失败: ' + e.message)); });
      // 取消轮询：ttsStop 后 gen 递增，立即结束（pause 不触发 onended）
      const poll = setInterval(function() {
        if (gen !== ttsGen) { clearInterval(poll); finish(); }
      }, 200);
      ttsAudio = audio;
    });
  }

  // 播放一句：native 直接 speak（含时长防线）；edge/local 播放预合成 URL
  function playSentence(text, url, engine, gen) {
    if (engine === 'native') {
      return new Promise(function(resolve, reject) {
        if (!ttsSupported()) { reject(new Error('浏览器不支持原生语音')); return; }
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = settings.ttsRate || 1.0;
        let started = false;   // 是否触发过 onstart
        let startTs = 0;       // onstart 时间戳（时长防线）
        let done = false;
        let startTimer = null;
        let poll = null;
        const finish = function(err) {
          if (done) return;
          done = true;
          if (startTimer) clearTimeout(startTimer);
          if (poll) clearInterval(poll);
          err ? reject(err) : resolve();
        };
        u.onstart = function() { started = true; startTs = performance.now(); };
        u.onend = function() {
          // 防线1：从未触发 onstart = 无声刷过
          if (!started) { finish(new Error('浏览器未播放语音（无可用中文语音），请更换朗读引擎')); return; }
          // 防线2：时长防线——中文朗读约 30ms/字，若 onstart→onend 过短 = 无声刷过
          const elapsed = performance.now() - startTs;
          const minOk = Math.max(150, text.length * 25);
          if (elapsed < minOk) { finish(new Error('语音播放异常（未真正出声），请更换朗读引擎')); return; }
          finish();
        };
        u.onerror = function(e) { finish(new Error('朗读出错: ' + e.error)); };
        // 3 秒未开始朗读 = 浏览器不支持/无语音 → 报错停止（不翻页）
        startTimer = setTimeout(function() {
          if (!started && gen === ttsGen) finish(new Error('浏览器未播放语音，可能不支持朗读'));
        }, 3000);
        // 取消轮询：ttsStop 后 gen 递增，立即结束（speechSynthesis.cancel 有时不触发回调）
        poll = setInterval(function() {
          if (gen !== ttsGen) { clearInterval(poll); try { speechSynthesis.cancel(); } catch (e) {} finish(); }
        }, 200);
        ttsUtterance = u;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      });
    }
    return playAudio(url, gen);
  }

  function ttsStop() {
    ttsGen++; // 使进行中的合成/播放全部失效
    ttsAborts.forEach(function(a) { try { a.abort(); } catch (e) {} }); // 中止所有在途合成
    ttsAborts = [];
    if (ttsUtterance) { try { speechSynthesis.cancel(); } catch (e) {} ttsUtterance = null; }
    if (ttsAudio) { try { ttsAudio.pause(); } catch (e) {} ttsAudio = null; }
    ttsState = 'idle';
    ttsAuto = false;
    clearTtsHighlight();
    updateTtsButton();
  }

  // 朗读主循环：流水线预合成逐句朗读（播放当前句时后台预生成下一句，消除句间等待）
  async function ttsLoop() {
    const gen = ttsGen;
    while (gen === ttsGen && ttsState !== 'idle' && chapterText) {
      const engine = settings.ttsEngine || 'edge';
      pageSentences = splitSentences(currentPageText());
      const speakSentences = pageSentences.filter(function(s) { return s !== '\n'; });
      if (!speakSentences.length) {
        // 当前页无内容（本章完）→ 直接切章
        if (chapterIndex >= chapters.length - 1) break;
        ttsAuto = true; nextChapter(); ttsAuto = false;
        await waitChapterReady();
        if (gen !== ttsGen) return;
        continue;
      }
      // 流水线：prefetch 保存下一句的合成 Promise（播放当前句时后台进行，不阻塞）
      let prefetch = null; // {text, promise}
      for (let i = 0; i < speakSentences.length && gen === ttsGen; i++) {
        ttsState = 'loading';
        updateTtsButton();
        try {
          renderHighlight(i);
          // 当前句音频：优先用预取结果（通常已就绪，立即播放）；第一句需现合成
          let url = null;
          if (prefetch && prefetch.text === speakSentences[i]) {
            url = await prefetch.promise;
          } else if (engine !== 'native') {
            url = await synthesizeText(speakSentences[i], engine, gen);
          }
          if (gen !== ttsGen) return;
          // 合成耗时较长，期间 readerText 可能被 reflow 覆盖 → 播放前重新渲染高亮
          renderHighlight(i);
          // 预取下一句（native 本地即时无需预取）
          const nextText = speakSentences[i + 1];
          if (nextText && engine !== 'native') {
            prefetch = { text: nextText, promise: synthesizeText(nextText, engine, gen) };
          } else {
            prefetch = null;
          }
          await playSentence(speakSentences[i], url, engine, gen);
        } catch (e) {
          if (gen !== ttsGen) return; // 已取消
          alert('朗读失败: ' + e.message);
          ttsStop();
          return;
        }
      }
      if (gen !== ttsGen) return;
      // 本页句子读完 → 翻页或切章
      const rest = chapterText.substring(pageOffset + snippetLen);
      if (rest.trim()) {
        // 同章节翻页（同步完成）
        ttsState = 'playing';
        ttsAuto = true; nextPage(); ttsAuto = false;
      } else if (chapterIndex < chapters.length - 1) {
        // 切章（异步加载，需等章节就绪再继续读）
        ttsState = 'playing';
        ttsAuto = true; nextChapter(); ttsAuto = false;
        await waitChapterReady();
        if (gen !== ttsGen) return;
      } else {
        break; // 全书读完
      }
    }
    if (gen === ttsGen) ttsStop(); // 正常结束（读完或章末）
  }

  // 等待章节加载完成（readerLoading 隐藏即就绪）
  function waitChapterReady() {
    const loading = document.getElementById('readerLoading');
    return new Promise(function(resolve) {
      let waited = 0;
      (function poll() {
        if (!loading || loading.style.display === 'none' || waited > 300) { resolve(); return; } // 最多 30s
        waited++;
        setTimeout(poll, 100);
      })();
    });
  }

  // 朗读按钮：点击开始/停止
  window.toggleTts = async function() {
    if (ttsState !== 'idle') { ttsStop(); return; }
    if (!chapterText) return;
    // 浏览器原生引擎预检：实际试读探测（不只看 getVoices，Chromium 无声时会立即 onend）
    if ((settings.ttsEngine || 'edge') === 'native') {
      const ok = await probeNativeTts();
      if (!ok) {
        alert('当前浏览器不支持内置语音朗读（无可用中文语音），请在设置中更换朗读引擎（如 Edge 云语音或局域网 Piper）');
        return; // 不朗读、不翻页
      }
    }
    ttsState = 'playing';
    updateTtsButton();
    ttsLoop();
  };

  // 实际试读探测：speak 一个短句，校验 onstart 触发且播放持续足够时间
  // （无声浏览器会触发 onstart 事件但瞬间 onend，需用时长判定）
  function probeNativeTts() {
    return new Promise(function(resolve) {
      if (!ttsSupported()) { resolve(false); return; }
      let settled = false;
      let startTs = 0;
      const timer = setTimeout(function() { done(false); }, 2500); // 2.5s 无结果 = 不支持
      function done(ok) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        try { speechSynthesis.cancel(); } catch (e) {}
        resolve(ok);
      }
      const u = new SpeechSynthesisUtterance('测试朗读');
      u.lang = 'zh-CN';
      u.rate = 1.0;
      u.onstart = function() { startTs = performance.now(); };
      u.onerror = function() { done(false); };
      u.onend = function() {
        if (!startTs) { done(false); return; } // 无 onstart = 无声
        const elapsed = performance.now() - startTs;
        done(elapsed >= 250); // 4字正常朗读约 1s+，<250ms 判定无声
      };
      try {
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch (e) { done(false); }
    });
  }

  function escHtml(s) {
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  function htmlToText(html) {
    const d = document.createElement('div'); d.innerHTML = html;
    return d.textContent || d.innerText || '';
  }

  // ─── 窗口调整 ──────────────────────
  let resizeTimer;
  window.onresize = function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (chapterText) reflowPage(); }, 150);
  };

  loadBooks();
})();
</script>
